{% extends "base.html" %}
{% block content %}
<!-- Content for logged-in users -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chewy&display=swap');
        .company-name {
            font-family: 'Chewy', cursive;
            font-size: 1.5rem; /* Adjust as needed */
            text-align: center;
            margin-top: 10px;
        }
        h1 {
            font-family: 'Chewy', cursive;
            font-size: 2rem; /* Adjust as needed */
            text-align: center;
            margin-top: 20px;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        .tile {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .tile:hover {
            transform: scale(1.05);
        }
        .tile img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .tile h3 {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Company Deals</h1>
    <div class="container" id="companyContainer"></div>
    <script>
        async function fetchCompanies() {
            const response = await fetch('/get_companies');
            const companies = await response.json();
            const container = document.getElementById('companyContainer');
            container.innerHTML = '';

            companies.forEach(company => {
                if (!company.deallink) return; // Skip if no deal link

                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `
                    <img src="${company.image_url}" alt="${company.companyname}" onerror="this.src='/static/default.png'">
                    <h3 class="company-name">${company.companyname}</h3>
                `;
                
                tile.addEventListener('click', () => {
                    window.open(company.deallink, '_blank'); // Open in new tab
                });

                container.appendChild(tile);
            });
        }

        
        fetchCompanies();
    </script>
</body>
</html>
{% endblock %}
