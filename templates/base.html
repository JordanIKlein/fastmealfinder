<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Meal Finder</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chewy&display=swap');

  /* General styles */
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(to bottom, yellow, #FF0040);
    background-size: 100% 100%;
    background-attachment: fixed;
    min-height: 100vh; /* Changed from height to min-height */
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Navbar (Desktop) */
  .navbar {
    width: 100%;
    display: flex;
    align-items: center;
    background-color: red;
    color: white;
    padding: 10px 20px;
    font-family: 'Chewy', cursive;
    font-size: 22px;
    height: auto;
    z-index: 1002;
    box-sizing: border-box;
  }

  /* Logo Styling */
  .navbar img {
    height: 105px;
    width: auto;
  }

  /* Navigation Links (Desktop) */
  .nav-links {
    display: flex;
    flex-wrap: nowrap;
    gap: 15px;
    margin-left: 20px;
    border-radius: 12px;
  }

  .nav-links a {
    text-decoration: none;
    color: red;
    font-weight: bold;
    padding: 5px 20px;
    white-space: nowrap;
    background-color: yellow;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .navbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .nav-links a:hover {
    background-color: rgb(172, 172, 1);
    color: red;
    border-radius: 5px;
  }

  /* Right Side of Navbar (Profile Dropdown) */
  .navbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 15px;
    padding-right: 50px;
  }

  /* Profile Dropdown Styles */
  .navbar-right .dropdown {
    display: flex;
    align-items: center;
  }

  .navbar-right .dropdown a {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .navbar-right .dropdown img {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    margin-right: 10px;
  }

  /* Dropdown container */
  .dropdown {
    position: relative;
    display: inline-block;
    cursor: pointer;
  }

  /* Hidden dropdown menu */
  .dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: white;
    min-width: 150px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    z-index: 1000;
  }

  /* Dropdown items */
  .dropdown-menu a {
    display: block;
    padding: 10px;
    text-decoration: none;
    color: black;
  }

  .dropdown-menu a:hover {
    background-color: #f2f2f2;
  }

  /* Content Section - updated for scrolling */
  .content {
    flex: 1;
    position: relative;
    overflow-y: auto; /* Allow vertical scrolling */
    overflow-x: hidden;
    box-sizing: border-box;
    padding: 15px;
    margin-bottom: 80px; /* Space for footer */
  }

  /* Mobile Styling */
  @media (max-width: 480px) {
    .navbar-left {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 8px;
      margin-left: 10px;
    }

    .nav-links a {
      padding: 5px 15px;
      font-size: 16px;
    }

    .navbar img {
      height: 65px;
      width: auto;
    }

    .navbar-right {
      margin-left: auto;
      display: flex;
      gap: 10px;
      padding-right: 20px;
    }
  }
  
  /* Footer Styling */
  .footer {
    width: 100%;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    text-align: center;
    font-size: 16px;
    padding: 15px clamp(10px, 4vw, 20px);
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 1001;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Show footer only when it should be visible */
  .footer.visible {
    transform: translateY(0);
  }
  
  /* Hide footer by default */
  .footer {
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }

  /* Footer links */
  .footer a {
    color: #ffc95c;
    text-decoration: none;
    font-weight: bold;
  }

  .footer a:hover {
    color: yellow;
  }

  /* For mobile responsiveness */
  @media (max-width: 480px) {
    .footer {
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .footer p {
      margin: 5px 0;
    }

    .footer a {
      display: inline-block;
      margin-right: 8px;
    }
  }
</style>
</head>
<body>
  <!-- Navigation Bar -->
  <div class="navbar">
    <!-- Left Section: Logo + Nav Links -->
    <div class="navbar-left">
      <img src="/static/icon.png" alt="FastMealFinder Logo">
      <div class="nav-links">
        <a href="{{ url_for('explore') }}">Explore</a>
        <a href="{{ url_for('deals') }}">Exclusive Deals</a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Footer - Uncommented -->
  <footer class="footer">
    <p>
      FastMealFinder © 2025 |
      <a href="{{ url_for('disclaimer') }}">Disclaimers</a>
    </p>
    <p>
      <a href="https://www.instagram.com/fastmealfinder/" target="_blank">Instagram </a>
      <a href="https://x.com/fastmealfinder" target="_blank">Twitter</a>
      <a href="https://discord.gg/w4XtgbkqPX" target="_blank">Discord</a> 
    </p>
  </footer>
  
  <script>
    // Show footer only when scrolling to the bottom
    document.addEventListener("DOMContentLoaded", function () {
      const footer = document.querySelector(".footer");
      
      function checkScroll() {
        // Get the height of the entire document
        const scrollHeight = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        );
        
        // Current scroll position + viewport height
        const scrollPosition = window.scrollY + window.innerHeight;
        
        // Show footer when near bottom (within 10px)
        if (scrollHeight - scrollPosition <= 10) {
          footer.classList.add("visible");
        } else {
          footer.classList.remove("visible");
        }
      }

      // Check on initial load
      checkScroll();
      
      // Check on scroll
      window.addEventListener("scroll", checkScroll);
      
      // Check on resize (responsive design)
      window.addEventListener("resize", checkScroll);
    });
  </script>
</body>
</html>
