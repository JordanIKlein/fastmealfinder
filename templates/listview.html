<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Meal Finder – Restaurant List</title>
  <meta name="description" content="Browse a list of open restaurants, drive-thrus, and 24-hour locations near you.">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="stylesheet" href="static/main.css">
  <link rel="stylesheet" href="static/list.css">
  
</head>
<body class="listview">
  <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
  <div class="hamburger-menu" id="hamburgerMenu">
    <a href="/list">List</a>
    <a href="/map">Map</a>
      <!-- <a href="/deals">Deals</a>
      <a href="/menu">Menu</a> -->
  </div>
  <a class="logo" href="/">
    <img src="static/images/icon.webp" alt="Fast Meal Finder Logo" loading="lazy" width="300" height="231">
  </a>
  <button class="filter-toggle" id="filterToggleBtn">Filters<span class="filter-badge" id="filterBadge"></span></button>
  <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">☀︎</button>
  <!-- Location button matches index.html -->
  <button class="location-btn" id="locationBtn" aria-label="Use my location">
    <span class="location-icon">📍</span>
    <span class="location-spinner">
      <span class="location-spinner-wrap">
        <span class="location-spinner-circle"></span>
      </span>
    </span>
  </button>
  <div id="geoStatus" class="visually-hidden" aria-live="polite"></div>
  <div class="filter-panel compact" id="filterPanel">
    <h3>Browse Options</h3>
    <div class="filter-group">
      <label for="sortSelect">Sort</label>
      <select id="sortSelect">
        <option value="relevance">Relevance</option>
        <option value="distance" disabled>Distance</option>
        <option value="name">Name (A–Z)</option>
      </select>
    </div>
    <!-- Restaurants dropdown moved directly under Sort -->
    <div class="filter-group">
      <label for="companySelect">Restaurants</label>
      <select id="companySelect">
        <option value="">All Restaurants</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Filters</label>
      <div class="checkbox-group">
        <label class="inline-checkbox"><input type="checkbox" id="openNow" checked> Open Now</label>
        <label class="inline-checkbox"><input type="checkbox" id="driveThru"> Drive-Thru</label>
        <label class="inline-checkbox"><input type="checkbox" id="open24h"> 24-Hour</label>
      </div>
    </div>
    <!-- Apply/Back removed: filters auto-apply -->
  </div>
  <div id="listContainer" class="list-container list-container-full" aria-live="polite"></div>

  <footer class="footer">
    <div class="footer-content">
      <span>FastMealFinder © 2025</span>
      <div class="social-icons">
          <a href="https://www.instagram.com/fastmealfinder/" target="_blank" aria-label="Instagram" class="social-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      </div>
    </div>
  </footer>

  <script nonce="{{ csp_nonce }}">
    // --- State ---
    let allRestaurantData = [];
  let filteredData = [];
  let renderBatchSize = 40; // number of cards per incremental render
  let lastRenderIndex = 0;  // how many have been rendered so far
  let isRendering = false;  // guard
    let imageCache = new Map();
    let userPosition = null;

    // Safe encode for HTML attribute contexts
    function escAttr(s){
      return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function sanitizeCompanyName(name) {
      return (name || '').toLowerCase().replace(/\s+/g,'-').replace(/'/g,'').replace(/&/g,'and');
    }

    function preloadAndCacheImage(company) {
      const sanitized = sanitizeCompanyName(company);
      const logoUrl = `/static/images/logos/${sanitized}.webp`;
      if (imageCache.has(company)) { return Promise.resolve(imageCache.get(company)); }
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => { imageCache.set(company, logoUrl); resolve(logoUrl); };
        img.onerror = () => { resolve(null); };
        img.src = logoUrl;
      });
    }

    // Distance (meters) using haversine
    function computeDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // m
      const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1)*Math.PI/180; const Δλ = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R*c)/1609.344; // miles
    }

    function getTodayHours(hoursMap) {
      if (!hoursMap) return null; const now = new Date();
      const key = now.toLocaleDateString('en-US',{weekday:'long'}).toLowerCase();
      return hoursMap[key] || null;
    }
    function formatTime(t) { if(!t) return ''; const [h,m] = t.split(':').map(Number); const d=new Date(); d.setHours(h,m); return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
    function getOpeningCountdown(hours) {
      if (!hours || hours.length<2) return null; const now=new Date();
      const [start] = hours; const [sh, sm] = start.split(':').map(Number); const open=new Date(); open.setHours(sh,sm,0,0);
      if (open>now) { const diffMins = Math.round((open-now)/60000); if (diffMins<60) return `Opens in ${diffMins} min`; const h=Math.floor(diffMins/60); const m=diffMins%60; return `Opens in ${h}h${m?` ${m}m`:''}`; }
      return null;
    }
    function getHoursDisplay(isOpen, hours) {
      const now=new Date(); if (!hours || hours.length<2) return isOpen? 'Open now':'Closed';
      const [openTime, closeTime] = hours; if (openTime==='00:00' && closeTime==='23:59') return isOpen? 'Open 24h':'Closed';
      if (isOpen) {
        if (closeTime < openTime) { return `Open until ${formatTime(closeTime)}`; } else { return `Open until ${formatTime(closeTime)}`; }
      } else {
        return getOpeningCountdown(hours) || 'Closed';
      }
    }

  function createRestaurantCard(r) {
      const dineInOpen = r.open_now_dine_in; const driveThruOpen = r.open_now_drive_thru;
      const dineInHoursToday = getTodayHours(r.normalized_hours_dine_in);
      const driveThruHoursToday = getTodayHours(r.normalized_hours_drive_thru);
      const dineInStatus = getHoursDisplay(dineInOpen, dineInHoursToday);
      const driveThruStatus = getHoursDisplay(driveThruOpen, driveThruHoursToday);
      const doorDashUrl = r.doordash_link; const uberEatsUrl = r.ubereats_link;
      let distanceHtml = '';
      if (userPosition) {
        const miles = computeDistanceMiles(userPosition.lat, userPosition.lng, r.latitude, r.longitude);
        distanceHtml = `<span class="distance-pill">~${miles.toFixed(1)} mi</span>`;
      }
      const logoLoaded = imageCache.has(r.company);
      const logoUrl = imageCache.get(r.company);
      const initial = (r.company||'?').charAt(0).toUpperCase();
      const statusClass = (dineInOpen||driveThruOpen) ? 'status-open' : 'status-closed';
      const markerCircle = `
        <div class="logo-avatar ${statusClass}">
          ${logoLoaded && logoUrl 
            ? `<img class="logo-avatar-img ${dineInOpen||driveThruOpen ? '' : 'closed'}" src="${logoUrl}" alt="${r.company}">`
            : `<span class=\"logo-avatar-initial ${statusClass}\">${initial}</span>`}
        </div>`;

      return `
        <div class="restaurant-card list" data-id="${r.id}">
          <div class="card-header list">
            ${markerCircle}
            <div class="header-col">
              <div class="header-row">
                <h3 class="restaurant-name list">${r.company}</h3>
                ${distanceHtml}
              </div>
              <div class="hours-info list">
                <div class="primary-hours small ${dineInOpen? '' : 'closed'}">${dineInStatus}</div>
                ${r.has_drive_thru && driveThruHoursToday ? `<div class="drive-thru-hours small">Drive-thru: ${driveThruStatus}</div>`:''}
              </div>
            </div>
          </div>
          <div class="card-content list">
            <div class="address-blurb">
              ${[r.address, r.city, r.state, r.zip].filter(Boolean).join(', ')}
            </div>
            <div class="badge-row">
              ${r.has_wifi?'<span class="feature-tag wifi small">🛜 WiFi</span>':''}
              ${r.has_online_ordering?'<span class="feature-tag online-ordering small">💻 Online</span>':''}
              ${r.has_catering?'<span class="feature-tag catering small">🍽️ Catering</span>':''}
              ${r.has_drive_thru?'<span class="feature-tag dt small">🚗 Drive-Thru</span>':''}
            </div>
            <div class="actions-section list">
              <button class="contact-btn directions-btn" data-address="${escAttr(r.address||'')}" data-city="${escAttr(r.city||'')}" data-state="${escAttr(r.state||'')}" data-zip="${escAttr(r.zip||'')}">Directions</button>
              ${r.phone_number?`<a href="tel:${String(r.phone_number).replace(/[^+0-9]/g,'')}" class="contact-btn call-btn">Call</a>`:''}
              ${doorDashUrl?`<a href="${doorDashUrl}" target="_blank" rel="noopener" class="action-btn delivery-btn doordash-btn">DoorDash</a>`:''}
              ${uberEatsUrl?`<a href="${uberEatsUrl}" target="_blank" rel="noopener" class="action-btn delivery-btn ubereats-btn">Uber Eats</a>`:''}
            </div>
          </div>
        </div>`;
    }

    function openDirections(address, city, state, zip) {
      const parts=[address,city,state,zip].filter(v=>v&&String(v).trim()!=='');
      if(!parts.length){ alert('Address not available for this location'); return; }
      const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(parts.join(', '))}`;
      window.open(url,'_blank');
    }

    function populateCompanyDropdown(data) {
      const select=document.getElementById('companySelect');
      if(!select) return;
      const prev=select.value;
      const companies=[...new Set(data.map(r=>r.company).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      select.innerHTML='<option value="">All Restaurants</option>' + companies.map(c=>`<option value="${c}">${c}</option>`).join('');
      if(prev && companies.includes(prev)) select.value=prev;
    }

    function getFilters() {
      return {
        openNow: document.getElementById('openNow').checked,
        driveThru: document.getElementById('driveThru').checked,
        open24h: document.getElementById('open24h').checked,
        company: document.getElementById('companySelect').value
      };
    }
    function saveFilters() { try { localStorage.setItem('fastMealListFilters', JSON.stringify(getFilters())); } catch(e){} }
    function loadFilters() {
      try { const saved=localStorage.getItem('fastMealListFilters'); if(!saved) { document.getElementById('openNow').checked = true; return; } const f=JSON.parse(saved);
        document.getElementById('openNow').checked = f.openNow !== undefined ? !!f.openNow : true;
        document.getElementById('driveThru').checked=!!f.driveThru;
        document.getElementById('open24h').checked=!!f.open24h;
        setTimeout(()=>{ // after options loaded
          if(f.company) document.getElementById('companySelect').value=f.company;
          applyFilters();
        },50);
      } catch(e){ document.getElementById('openNow').checked = true; }
    }

    // Filter badge indicator
    function updateFilterBadge(){
      const btn=document.querySelector('.filter-toggle'); if(!btn) return;
      const hasActive = (!document.getElementById('openNow').checked) || document.getElementById('driveThru').checked || document.getElementById('open24h').checked || document.getElementById('companySelect').value;
      if(hasActive){ btn.classList.add('has-active'); } else { btn.classList.remove('has-active'); }
    }

    function applyFilters() {
      const {openNow, driveThru, open24h, company} = getFilters();
      filteredData = allRestaurantData.filter(r => {
        if (company && r.company !== company) return false;
        if (driveThru && !r.has_drive_thru) return false;
        if (openNow && !(r.open_now_dine_in || r.open_now_drive_thru)) return false;
        if (open24h && !(r.is_24h_dine_in || r.is_24h_drive_thru)) return false;
        return true;
      });
      sortData();
      resetInfiniteScroll();
      renderList();
      saveFilters();
      updateFilterBadge();
    }

    function sortData() {
      const sortVal = document.getElementById('sortSelect').value;
      try { localStorage.setItem('fastMealListSort', sortVal); } catch(e){}
      if (sortVal === 'relevance') {
        // Keep current order (API order) but we might bring open ones slightly up
        // Optional: stable partition by open status
        filteredData = filteredData.slice().sort((a,b)=>{
          const aOpen = (a.open_now_dine_in||a.open_now_drive_thru)?1:0;
          const bOpen = (b.open_now_dine_in||b.open_now_drive_thru)?1:0;
          if (aOpen!==bOpen) return bOpen - aOpen; // open first
          return 0; // preserve relative order otherwise
        });
        return;
      }
      if (sortVal === 'name') {
        filteredData.sort((a,b)=> (a.company||'').localeCompare(b.company||''));
        return;
      }
      if (sortVal === 'distance' && userPosition) {
        filteredData.sort((a,b)=> {
          const da = computeDistanceMiles(userPosition.lat, userPosition.lng, a.latitude, a.longitude);
          const db = computeDistanceMiles(userPosition.lat, userPosition.lng, b.latitude, b.longitude);
          return da - db;
        });
        return;
      }
      // If distance selected but we don't yet have geolocation, we'll defer; once geolocation arrives we'll re-sort.
    }

    function resetInfiniteScroll() {
      lastRenderIndex = 0;
      const container=document.getElementById('listContainer');
      container.innerHTML='';
    }

    function toggleFilters(){
      const p=document.getElementById('filterPanel');
      p.classList.toggle('open');
    }
    function closeFilters(){
      document.getElementById('filterPanel').classList.remove('open');
    }
    function applyFiltersAndClose(){ /* legacy noop for compatibility */ }

    function renderNextBatch() {
      if (isRendering) return; // guard
      const container=document.getElementById('listContainer');
      if(!filteredData.length) { container.innerHTML = '<div class="empty-state">No restaurants match your filters.</div>'; return; }
      if (lastRenderIndex >= filteredData.length) return; // nothing more
      isRendering = true;
      const slice = filteredData.slice(lastRenderIndex, lastRenderIndex + renderBatchSize);
      const fragHtml = slice.map(createRestaurantCard).join('');
      if (lastRenderIndex === 0) {
        container.innerHTML = fragHtml; // first batch
      } else {
        container.insertAdjacentHTML('beforeend', fragHtml);
      }
      // Opportunistic logo preload for this batch
      slice.forEach(r=>preloadAndCacheImage(r.company).then(()=>{
        const card = container.querySelector(`.restaurant-card.list[data-id="${r.id}"]`);
        if (card) { card.outerHTML = createRestaurantCard(r); }
      }));
      lastRenderIndex += slice.length;
      isRendering = false;
    }

    function renderList() {
      // Fresh render via infinite scroll batches
      renderNextBatch();
    }

    function handleScrollInfinite() {
      const container=document.getElementById('listContainer');
      // Load next batch when near bottom (within 800px of bottom)
      if (container.scrollTop + container.clientHeight + 800 >= container.scrollHeight) {
        renderNextBatch();
      }
    }

    function fetchRestaurants() {
      fetch('/api/restaurants')
        .then(r=>r.json())
        .then(data => {
          if(!Array.isArray(data)) return;
          allRestaurantData = data;
          populateCompanyDropdown(allRestaurantData);
          applyFilters();
          loadFilters();
          // Opportunistic logo warmup for first 12
          allRestaurantData.slice(0,12).forEach(r=>preloadAndCacheImage(r.company));
        })
        .catch(e=>{ console.error('Failed to load restaurants', e); });
    }

    function setDarkMode(isDark) {
      document.body.classList.toggle('dark', isDark);
      document.getElementById('darkModeToggle').textContent = isDark ? '☾' : '☀︎';
      localStorage.setItem('fastMealDarkMode', isDark ? 'true':'false');
    }
    function getInitialDarkMode() {
      const saved = localStorage.getItem('fastMealDarkMode');
      if (saved !== null) return saved === 'true';
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function requestGeolocation() {
      // Show loading state
      setLocationLoading(true);
      const distanceOption = document.querySelector('#sortSelect option[value="distance"]');
      if (!navigator.geolocation) { alert('Geolocation not supported in this browser.'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        // Determine nearest restaurant distance
        if (allRestaurantData.length) {
          const distances = allRestaurantData.map(r => computeDistanceMiles(userPosition.lat, userPosition.lng, r.latitude, r.longitude));
          const minDistance = Math.min(...distances.filter(d=>!isNaN(d)));
          if (isFinite(minDistance) && minDistance <= 100) {
            distanceOption.disabled = false;
            // Auto-switch to distance sort when user explicitly requests location
            const sortSelect = document.getElementById('sortSelect');
            const previous = sortSelect.value;
            sortSelect.value = 'distance';
            // Persist selection & re-render
            sortData();
            resetInfiniteScroll();
            renderList();
            // Early return since we've already handled re-render
            setLocationLoading(false);
            return;
          } else {
            distanceOption.disabled = true;
            alert('Distance sorting disabled (nearest restaurant is more than 100 miles away).');
          }
        } else {
          distanceOption.disabled = true;
        }
        if (document.getElementById('sortSelect').value === 'distance' && !distanceOption.disabled) {
          sortData();
          resetInfiniteScroll();
          renderList();
        } else {
          renderList();
        }
        setLocationLoading(false);
      }, err => {
        alert('Location permission denied. Distance sorting unavailable.');
        setLocationLoading(false);
      }, { enableHighAccuracy:true, timeout:8000 });
    }

    function setLocationLoading(isLoading){
      const btn = document.getElementById('locationBtn');
      const status = document.getElementById('geoStatus');
      if(!btn) return;
      if(isLoading){
        btn.classList.add('loading');
        btn.disabled = true;
        btn.setAttribute('aria-busy','true');
        if(status) status.textContent = 'Locating…';
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        if(status) status.textContent = '';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setDarkMode(getInitialDarkMode());
      document.getElementById('darkModeToggle').addEventListener('click', () => setDarkMode(!document.body.classList.contains('dark')));
      // Wire filter toggle without inline handlers (CSP-safe)
      const filterToggleBtn = document.getElementById('filterToggleBtn');
      if (filterToggleBtn) {
        filterToggleBtn.addEventListener('click', () => {
          toggleFilters();
        });
      }
      ['openNow','driveThru','open24h','companySelect'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => { applyFilters(); if(window.innerWidth<=640){ closeFilters(); } });
      });
      // If initial dataset was limited for any reason, ensure full set loads on focus
      document.getElementById('companySelect').addEventListener('focus', () => {
        if(!allRestaurantData || allRestaurantData.length < 15){ fetchRestaurants(); }
      });
      // Restore persisted sort (before adding listener)
      try { const savedSort=localStorage.getItem('fastMealListSort'); if(savedSort){ const sel=document.getElementById('sortSelect'); if(['relevance','distance','name'].includes(savedSort)){ sel.value=savedSort; } } } catch(e){}
      document.getElementById('sortSelect').addEventListener('change', () => { sortData(); resetInfiniteScroll(); renderList(); });
      document.getElementById('locationBtn').addEventListener('click', requestGeolocation);
      // Delegate Directions clicks (CSP-safe, covers dynamically rendered cards)
      document.body.addEventListener('click', (e)=>{
        const btn = e.target.closest('.directions-btn');
        if(btn){
          e.preventDefault();
          openDirections(btn.dataset.address, btn.dataset.city, btn.dataset.state, btn.dataset.zip);
        }
      });
      const hambtn=document.getElementById('hamburgerBtn');
      const hamMenu=document.getElementById('hamburgerMenu');
      hambtn.addEventListener('click',(e)=>{ e.stopPropagation(); hamMenu.classList.toggle('open'); });
      document.addEventListener('click',(e)=>{ if(!hamMenu.contains(e.target) && e.target!==hambtn){ hamMenu.classList.remove('open'); } });
      updateFilterBadge();
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeFilters(); hamMenu.classList.remove('open'); } });
      // Infinite scroll listener
      document.getElementById('listContainer').addEventListener('scroll', handleScrollInfinite, { passive:true });
      fetchRestaurants();
      // System preference listener (only if user hasn't explicitly toggled?)
      if (window.matchMedia) {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener('change', e => {
          if (localStorage.getItem('fastMealDarkMode') === null) setDarkMode(e.matches);
        });
      }
    });
  </script>
  
</body>
</html>
